model:
  name: "__MODEL_PATH__"
  dtype: "bfloat16"
  attn_impl: "sdpa"
  trust_remote_code: false
  use_liger_kernel: false
  quantization: "none"

data:
  name: "local"
  format: "chatml"
  format_options:
    messages_field: "messages"
  train_path: "__TRAIN_PATH__"
  tokenized_path: null
  cache_dir: "__TOKENIZED_ROOT__"
  seq_len: 256
  num_workers: 2
  tokenize_batch_size: 16
  tokenize_compression: "snappy"
  prefetch_batches: 1
  local_shuffle_buffer_multiplier: 2
  pack_sequences: false

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.0
  target_modules: ["q_proj", "v_proj"]

training:
  # One worker uses batch size 2, preserving the original two-worker global
  # batch size and the four optimizer steps per eight-example epoch.
  batch_size: 2
  grad_accum: 1
  lr: 5.0e-4
  weight_decay: 0.0
  max_steps: 30
  num_epochs: 5
  warmup_steps: 2
  max_grad_norm: 1.0
  seed: 20260806
  deterministic: false
  distributed:
    strategy: "ddp"
    ddp:
      find_unused_parameters: false
      gradient_as_bucket_view: true
      broadcast_buffers: false
      activation_checkpointing: false
      static_graph: false

checkpoint:
  enabled: true
  save_dir: "__CHECKPOINT_DIR__"
  save_interval: 1
  keep_last_n: 10

logging:
  tracker: null
  project: "slakshna-cluster-repro"
  run_name: "__RUN_NAME__"

monitoring:
  dashboard: false
  metrics:
    enabled: true
    system_every_n_steps: 0
    cuda_every_n_steps: 0
    throughput: false

evaluation:
  enabled: false
