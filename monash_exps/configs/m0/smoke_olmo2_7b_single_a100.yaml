# M0 single-A100 validation of the native Bhaskera DDP training path.
# Runtime paths are resolved to absolute paths by prepare_single_gpu_smoke.py.

model:
  name: "monash_exps/.runtime/models/m0/OLMo-2-1124-7B-Instruct"
  trust_remote_code: false
  dtype: "bfloat16"
  attn_impl: "flash_attention_2"
  use_liger_kernel: true
  quantization: "none"

data:
  name: "local"
  format: "chatml"
  format_options:
    messages_field: "messages"
  tokenized_path: "monash_exps/.runtime/data/m0/tokenized/olmo2-7b-chatml-seq1024/australia_nz/local_train_c4253f2a8d6a7d19"
  seq_len: 1024
  num_workers: 4
  prefetch_batches: 1
  local_shuffle_buffer_multiplier: 10
  is_cpt: false
  pack_sequences: false

lora:
  enabled: true
  r: 16
  alpha: 64
  dropout: 0.03
  target_modules: ["q_proj", "v_proj"]
  include_experts: false
  freeze_router: true
  modules_to_save: []
  resume_path: "monash_exps/.runtime/artifacts/m0/g0/olmo2-7b-r16-qv-seed20260820.pth"

training:
  batch_size: 2
  grad_accum: 4
  lr: 1.0e-4
  weight_decay: 0.0
  max_steps: 12
  num_epochs: 1
  warmup_steps: 1
  max_grad_norm: 1.0
  grad_clip: 1.0
  max_grad_skip_steps: 20
  seed: 20260820
  deterministic: false
  optimizer:
    backend: "default"
  distributed:
    strategy: "ddp"
    ddp:
      find_unused_parameters: false
      gradient_as_bucket_view: true
      broadcast_buffers: false
      activation_checkpointing: false
      static_graph: false

checkpoint:
  enabled: true
  save_dir: "monash_exps/.runtime/runs/m0/smoke-olmo2-7b-single-a100/checkpoints"
  save_interval: 1
  keep_last_n: 1

logging:
  tracker: "ray"
  project: "m0"
  run_name: "smoke-olmo2-7b-single-a100"
  log_gpu_every_n_steps: 1
  tags: ["m0", "smoke", "olmo2-7b", "single-a100"]

evaluation:
  enabled: false

monitoring:
  dashboard: false
  metrics:
    enabled: true
    system_every_n_steps: 1
    cuda_every_n_steps: 1
    gpu: true
    cpu: true
    cuda_memory: true
    throughput: true
    peak_tflops_per_gpu: 312.0
    throughput_window: 5
    throughput_warmup: 2
